<h2>1. 최종 결론</h2>
<p>LocalTTS는 배치 파일과 브라우저 의존형 시제품에서 시작해, WinForms 채팅 입력&#183;PIP,</p>
<p>본인 모니터링, Discord 마이크 릴레이, GPT-SoVITS 기반 음성, 비정상 출력 차단,</p>
<p>단일 48kHz float 송출 버스를 갖춘 로컬 앱으로 발전했다.</p>
<p>최종 v4.4는 v4.3의 4화자 조화 모델과 안정장치를 그대로 보존하면서 저중역 마스킹을</p>
<p>0.75dB 단위의 미세 파형 보정으로 줄였다. 25문장 ASR 정확도와 시간축은 v4.3과</p>
<p>동일하게 유지했고, 자음 존재감과 스펙트럼 중심만 개선했다. 모델을 더 크게 만들거나</p>
<p>추가 신경망을 상주시킨 것이 아니므로 GPU 메모리 증가는 없고, 5.38초 WAV의 CPU</p>
<p>후처리는 평균 6.19ms였다.</p>

<h2>2. 평가 원칙</h2>
<p>한두 문장의 인상만으로 운영 모델을 교체하지 않았다. 다음 축을 함께 검사했다.</p>
<ul>
<li>발음: Whisper 기반 문자 오류율(CER), 정확 일치 문장, 문장별 최대 오류</li>
<li>시간: 전체 길이, 내부 장무음, 입력 길이에 비해 비정상적으로 긴 출력</li>
<li>파형: RMS, near-silence, 급격한 샘플 변화, clipping, spectral centroid</li>
<li>음색: 750Hz 저중역, 2~4.5kHz 자음 presence, 비음/자음 에너지 비</li>
<li>안정성: 여러 seed, 반복 합성, 서버 재기동, 장치 재열기</li>
<li>자원: 모델 크기, Working Set, Private Memory, GPU 메모리, 정상/실패 합성 횟수</li>
</ul>
<p>운영 적용 조건은 평균 개선뿐 아니라 문장별 회귀, 없는 감탄사, 반복, 장무음,</p>
<p>클리핑이 없어야 한다는 보수적 기준이었다.</p>
<h2>3. 발전 과정과 문제 해결</h2>
<h3>3.1 실행 구조와 로컬 UI</h3>
<p>초기 <code>run</code> 배치 파일은 인코딩/경로 문제로 “배치 파일이 아닙니다”와 유사한 오류를</p>
<p>내고 창이 닫혔다. 실행 폴더를 <code>%~dp0</code>로 고정하고, 빌드 실패 시 창을 유지하며,</p>
<p>브라우저 대신 WinForms 실행 파일을 만들었다. 채팅을 Enter로 합성하고 접수된 글은</p>
<p>즉시 지우도록 했으며, PIP는 한 줄 입력만 남기고 X를 누르면 종료 대신 본창으로</p>
<p>돌아가도록 정리했다. 브라우저 프로세스를 제거해 게임 중 메모리 변동도 줄였다.</p>
<h3>3.2 본인 청취와 Discord 송출</h3>
<p>TTS를 가상 케이블에만 보내면 사용자는 합성 여부를 알 수 없었다. 한 번 만든 WAV를</p>
<p>모니터 장치와 Discord 장치에 동시에 재생하도록 분기했다. 실제 마이크는 Discord</p>
<p>경로에만 넣어 지연된 자기 목소리가 모니터로 돌아오지 않게 했다.</p>
<p>초기 송출은 마이크와 각 TTS가 같은 VB-CABLE 장치를 별도 <code>WaveOutEvent</code>로 열어</p>
<p>경쟁했고, 44.1/48kHz 변환까지 겹쳐 음절 누락이 생겼다. 이를 장치당 하나의 장기 실행</p>
<p><code>WasapiOut</code> shared-mode 버스로 합치고, 장치 기본값과 같은 48kHz stereo IEEE float로</p>
<p>통일했다. 정상 endpoint는 발화 후 유지하고 실제 중단 때만 재생성한다. 한 발화가</p>
<p>끝날 때까지 다음 발화를 막고 Discord gain은 100% 이하로 제한했다.</p>
<p>첫 발화 뒤 이후 음성이 웅얼거리거나 사라진 문제는 매 문장 endpoint를 닫고 다시 여는</p>
<p>회귀가 직접 원인이었다. 장기 endpoint 재사용으로 수정한 뒤 비무음 신호 30회,</p>
<p>동시 입력 8개, 재열기 8회를 통과했다.</p>
<h3>3.3 Discord Studio에서만 정상인 현상</h3>
<p>Studio/순수 오디오에서 정상이라는 A/B는 <code>TTS → 앱 → VB-CABLE → Discord 입력</code>까지</p>
<p>신호가 정상임을 뜻한다. 일반 입력 프로필의 Krisp, echo cancellation, AGC, voice</p>
<p>activity gate가 깨끗한 디지털 합성음을 비음성으로 오판해 작은 자음과 모음을 제거한</p>
<p>것이었다. 따라서 가상 케이블 TTS에는 Studio가 자연스러운 운영 설정이다. Studio를</p>
<p>쓰지 않을 경우 모든 후처리와 자동 감도를 끄고 Standard/Legacy subsystem을 비교한다.</p>
<h3>3.4 Mashiro 기준 음성의 발음 개선</h3>
<p>주요 증상은 <code>ㅇ</code> 밀집/연음에서 급하게 삼키는 발음, 띄어쓰기 민감성, 문장에 없는</p>
<p>“하/아” 삽입, 구간 경계의 지지직이었다. 다음 개선이 운영 경로에 남았다.</p>

<p>5파일의 CER은 8.18%로 동일했다. C# 구현은 파일당 2~4샘플만 바꾸고 첫 JIT 이후</p>
<p>약 4.2~5.2ms가 걸려 추가 RAM/VRAM 없이 채택됐다.</p>

<h3>3.6 Reference, G2P, seed 실험</h3>
<p>Full reference는 일부 문장을 개선했지만 64.06초 출력과 94.6% 무음을 만들었다.</p>
<p>원본 reference의 68샘플만 보간한 micro-declick도 독립 9문장에서 CER 4.38→4.06%였지만</p>
<p>5문장&#215;5 seed에서 양쪽 6.63%, 클릭 46으로 동률이라 미적용했다.</p>
<p>선택적 G2P는 21문장 중 실제 phoneme가 바뀐 2문장만 소폭 변화했으나, 검수 자료</p>
<p>785개에서 차이가 난 7개를 확대 평가하자 평균 CER이 15.24→25.02%로 악화했다.</p>
<p>고정 seed 404도 첫 세트에서는 12.83→8.08%였지만 독립 세트에서 4.38→8.77%로</p>
<p>뒤집혔다. reference/G2P/seed는 국소 이득이 반복 검증되지 않아 운영 경로에서 제외했다.</p>

<p>화자별 학습량 차이를 없애기 위해 체크포인트 단순 평균 대신 모듈별 task vector를</p>

<h2>5. 자원과 게임 병행 관점</h2>
<p>모델 추론 부하는 앱이 처음 음성을 부를 때만이 아니라 <strong>채팅을 입력해 합성할 때마다</strong></p>
<p>발생한다. 다만 모델은 첫 호출 후 메모리에 유지되므로 매 문장 재로딩은 하지 않는다.</p>
<p>대기 중 앱 UI는 가볍지만 엔진의 RAM/VRAM은 상주한다. Python은 <code>BelowNormal</code> 우선순위로</p>
<p>실행해 게임 스레드 우선권을 보존한다.</p>
<p>SSD와 HDD에 페이지 파일을 동시에 둘 수 있지만, 페이지 파일은 느린 RAM 대체이며</p>
<p>GPU VRAM 부족이나 전원/온도 문제를 해결하지 않는다. 게임이 전체 자원을 80~90%</p>
<p>사용한다면 합성 순간 frame-time spike가 생길 수 있다. 안전 운영은 SSD 페이지 파일을</p>
<p>시스템 관리로 유지하고, VS Code/브라우저를 닫고, 게임 VRAM 여유를 약 1.2GB 이상</p>
<p>확보하며, TTS 문장을 연속으로 겹치지 않는 것이다. 자동 재부팅은 보통 단순 CPU 100%</p>
<p>보다 전원&#183;온도&#183;드라이버&#183;메모리 불안정 가능성을 먼저 점검한다.</p>
